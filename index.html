<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Practical Portfolio</title>
    <style>
        /* Modern CSS Reset & Background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* Glassmorphism Container */
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #4a4a4a;
            border-bottom: 2px solid #764ba2;
            display: inline-block;
            padding-bottom: 10px;
        }

        .project-list {
            list-style: none;
            padding: 0;
        }

        /* Styling each Link Item */
        .project-item {
            margin-bottom: 15px;
        }

        .project-link {
            display: block;
            text-decoration: none;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            color: #764ba2;
            font-weight: 600;
            border: 1px solid #ddd;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Hover Animation */
        .project-link:hover {
            background: #764ba2;
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(118, 75, 162, 0.3);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lab Practicals</h1>
        
        <div class="project-list">
            <!-- Project 2 -->
            <div class="project-item">
                <a href="PRACTICAL 2" class="project-link">📂 Practical 02</a>
            </div>

            <!-- Project 3 -->
            <div class="project-item">
                <a href="practical3.html" class="project-link">📄 Practical 03</a>
            </div>

            <!-- Project 5 -->
            <div class="project-item">
                <a href="practical5.html" class="project-link">📄 Practical 05</a>
            </div>

            <!-- Project 6 -->
            <div class="project-item">
                <a href="practical6.html" class="project-link">📄 Practical 06</a>
            </div>

            <!-- Pre-Lab -->
            <div class="project-item">
                <a href="prelab.html" class="project-link">📝 Pre-Lab Assignment</a>
            </div>
        </div>

        <p class="footer-text">Created by Prajwal Prajapati</p>
    </div>

</body>
</html>
