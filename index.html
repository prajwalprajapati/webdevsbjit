<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prajwal's Project Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-1: #38bdf8; /* Blue */
            --accent-2: #818cf8; /* Indigo */
            --accent-3: #fb7185; /* Rose */
            --accent-4: #34d399; /* Emerald */
            --accent-5: #fbbf24; /* Amber */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Entrance Animation */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hub-container {
            width: 90%;
            max-width: 600px;
            animation: fadeInUp 0.8s ease-out;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .project-grid {
            display: grid;
            gap: 20px;
        }

        /* The Card Design */
        .project-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        /* Floating Animation on Hover */
        .project-card:hover {
            transform: scale(1.05);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        /* The Little Colored Box */
        .color-box {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .card-info h3 { margin: 0; font-size: 1.1rem; }
        .card-info p { margin: 5px 0 0; font-size: 0.85rem; color: #94a3b8; }

        /* Custom Colors for each project */
        .c1 { background: var(--accent-1); box-shadow: 0 0 15px var(--accent-1); }
        .c2 { background: var(--accent-2); box-shadow: 0 0 15px var(--accent-2); }
        .c3 { background: var(--accent-3); box-shadow: 0 0 15px var(--accent-3); }
        .c4 { background: var(--accent-4); box-shadow: 0 0 15px var(--accent-4); }
        .c5 { background: var(--accent-5); box-shadow: 0 0 15px var(--accent-5); }

    </style>
</head>
<body>

    <div class="hub-container">
        <header>
            <h1>My Practicals</h1>
            <p>Prajwal Prajapati | Lab Portfolio</p>
        </header>

        <div class="project-grid">
            <!-- Practical 2 -->
            <a href="PRACTICAL 2" class="project-card">
                <div class="color-box c1">02</div>
                <div class="card-info">
                    <h3>Practical Two</h3>
                    <p>Core Concepts & Logic</p>
                </div>
            </a>

            <!-- Practical 3 -->
            <a href="practical3.html" class="project-card">
                <div class="color-box c2">03</div>
                <div class="card-info">
                    <h3>Practical Three</h3>
                    <p>UI Design Elements</p>
                </div>
            </a>

            <!-- Practical 5 -->
            <a href="practical5.html" class="project-card">
                <div class="color-box c3">05</div>
                <div class="card-info">
                    <h3>Practical Five</h3>
                    <p>Advanced Layouts</p>
                </div>
            </a>

            <!-- Practical 6 -->
            <a href="practical6.html" class="project-card">
                <div class="color-box c4">06</div>
                <div class="card-info">
                    <h3>Practical Six</h3>
                    <p>Interactive Components</p>
                </div>
            </a>

            <!-- Pre-Lab -->
            <a href="prelab.html" class="project-card">
                <div class="color-box c5">📝</div>
                <div class="card-info">
                    <h3>Pre-Lab</h3>
                    <p>Initial Research & Documentation</p>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
