
<html>
<head>
<title>Simple Scholarship Form</title>
</head>

<body>

<h2>MahaDBT Student Form</h2>

<form>

<fieldset>
<legend>Personal Information</legend>

Name:<br>
<input type="text" name="name"><br><br>

Email:<br>
<input type="email" name="email"><br><br>

Mobile Number:<br>
<input type="text" name="mobile"><br><br>

Gender:<br>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
<br><br>

</fieldset>

<br>

<fieldset>
<legend>Education Details</legend>

Course:<br>
<select>
<option>B.Tech</option>
<option>B.Sc</option>
<option>B.Com</option>
<option>B.A</option>
</select>
<br><br>

Year:<br>
<select>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>

<br><br>

</fieldset>

<br>

<fieldset>
<legend>Scholarship Options</legend>

Select Scholarship Type:<br>
<input type="checkbox"> Post Matric Scholarship<br>
<input type="checkbox"> Minority Scholarship<br>
<input type="checkbox"> Merit Scholarship<br>

<br>

State:<br>
<select>
<option>Maharashtra</option>
<option>Gujarat</option>
<option>Madhya Pradesh</option>
<option>Karnataka</option>
</select>

</fieldset>

<br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
